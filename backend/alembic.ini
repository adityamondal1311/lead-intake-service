[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# Date-prefixed filenames keep migrations readable in chronological order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# sqlalchemy.url is intentionally not set here: alembic/env.py reads DATABASE_URL from app settings.

[post_write_hooks]
# Format newly generated migrations with ruff so they pass the lint check.
hooks = ruff
ruff.type = module
ruff.module = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

# Logging is configured by alembic/env.py (the app's JSON logging), not here.
